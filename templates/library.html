<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frequency Library</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .nav { margin-bottom: 20px; }
    .source-note { color: #666; font-size: 13px; line-height: 1.5; background: #f7f7f7; border: 1px solid #eee;
                   border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 6px; position: sticky; top: 0; background: white;
                padding: 10px 0; z-index: 5; }
    #search { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    #categoryFilter { padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
    #resultCount { color: #888; font-size: 13px; margin-bottom: 14px; }
    .entry { border: 1px solid #ddd; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; }
    .entry-top { display: flex; justify-content: space-between; align-items: baseline; cursor: pointer; }
    .entry-name { font-weight: 600; font-size: 15px; }
    .entry-category { color: #888; font-size: 12px; }
    .entry-freqs { color: #666; font-size: 13px; margin-top: 4px; font-family: monospace; }
    .entry-form { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; }
    .entry-form.open { display: block; }
    .entry-form label { display: block; font-size: 13px; margin: 8px 0 3px; }
    .entry-form input[type=number] { padding: 6px; width: 140px; }
    .entry-form select { padding: 6px; }
    .entry-form input[type=file] { font-size: 13px; }
    .entry-form button { margin-top: 12px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
    .toggle-hint { color: #4a90d9; font-size: 12px; }
    .no-results { color: #888; padding: 30px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="nav"><a href="/generate">Freeform generator</a> &middot; <a href="/analyze">Analyze audio</a></div>
  <h1>Frequency Library</h1>

  <div class="source-note">
    <strong>Source:</strong> {{ meta.source }}<br>
    {{ meta.disclaimer }}
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search by name or category&hellip;" autocomplete="off">
    <select id="categoryFilter">
      <option value="">All categories</option>
      {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div id="resultCount"></div>

  <div id="entryList">
    {% for e in entries %}
    <div class="entry" data-name="{{ e.name|lower }}" data-category="{{ e.category }}">
      <div class="entry-top" onclick="toggleForm('{{ e.slug }}')">
        <div>
          <div class="entry-name">{{ e.name }}</div>
          <div class="entry-category">{{ e.category }}</div>
          <div class="entry-freqs">{{ e.frequencies_display }} Hz</div>
        </div>
        <div class="toggle-hint" id="hint-{{ e.slug }}">Generate &darr;</div>
      </div>

      <form class="entry-form" id="form-{{ e.slug }}" action="/library/{{ e.slug }}/generate" method="post" enctype="multipart/form-data">
        <label>Duration (seconds)</label>
        <input type="number" name="duration" value="300" step="10" min="10" max="3600">

        <label>Render mode</label>
        <select name="render_mode">
          <option value="auto">Auto (tone above 20Hz, pulse below)</option>
          <option value="isochronic">Force isochronic pulse for every step</option>
        </select>

        <label>Optional: layer under an imported file</label>
        <input type="file" name="layer_file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg">
        <label>Bed volume (0 = imported file only, 1 = generated sequence only)</label>
        <input type="number" name="mix_ratio" value="0.4" step="0.05" min="0" max="1">

        <div><button type="submit">Generate &amp; download</button></div>
      </form>
    </div>
    {% endfor %}
  </div>

  <div class="no-results" id="noResults" style="display:none;">No matches. Try a different search term.</div>

  <script>
    function toggleForm(slug) {
      const form = document.getElementById('form-' + slug);
      const hint = document.getElementById('hint-' + slug);
      const open = form.classList.toggle('open');
      hint.textContent = open ? 'Hide' : 'Generate ↓';
    }

    const searchBox = document.getElementById('search');
    const categorySelect = document.getElementById('categoryFilter');
    const entries = Array.from(document.querySelectorAll('.entry'));
    const resultCount = document.getElementById('resultCount');
    const noResults = document.getElementById('noResults');

    function applyFilter() {
      const q = searchBox.value.trim().toLowerCase();
      const cat = categorySelect.value;
      let visible = 0;
      entries.forEach(el => {
        const nameMatch = !q || el.dataset.name.includes(q);
        const catMatch = !cat || el.dataset.category === cat;
        const show = nameMatch && catMatch;
        el.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      resultCount.textContent = visible + (visible === 1 ? ' preset' : ' presets');
      noResults.style.display = visible === 0 ? 'block' : 'none';
    }

    searchBox.addEventListener('input', applyFilter);
    categorySelect.addEventListener('change', applyFilter);
    applyFilter();
  </script>
</body>
</html>
