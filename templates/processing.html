<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Analyzing...</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 640px; margin: 100px auto; padding: 0 20px; text-align: center; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 24px;
      border: 4px solid #eee; border-top-color: #4a90d9; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stage { font-size: 16px; color: #333; margin-bottom: 8px; }
    .elapsed { color: #999; font-size: 13px; }
    .error { background: #fee; border: 1px solid #f99; padding: 14px; border-radius: 6px; text-align: left; margin-top: 20px; }
    .error a { display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="working">
    <div class="spinner"></div>
    <div class="stage" id="stageText">Starting…</div>
    <div class="elapsed" id="elapsedText"></div>
  </div>
  <div id="errorBox" class="error" style="display:none;"></div>

  <script>
    const jobId = {{ job_id | tojson }};
    const startTime = Date.now();

    function poll() {
      fetch(`/job/${jobId}/status`)
        .then(r => r.json())
        .then(data => {
          const elapsed = Math.round((Date.now() - startTime) / 1000);
          document.getElementById('elapsedText').textContent = elapsed + 's elapsed';

          if (data.status === 'done') {
            document.getElementById('stageText').textContent = 'Done — loading report…';
            window.location.href = data.redirect_url;
            return;
          }
          if (data.status === 'error') {
            document.getElementById('working').style.display = 'none';
            const box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.innerHTML = (data.error || 'Something went wrong.') + '<br><a href="/">&larr; Try again</a>';
            return;
          }
          document.getElementById('stageText').textContent = (data.stage || 'working') + '…';
          setTimeout(poll, 1000);
        })
        .catch(() => setTimeout(poll, 2000));
    }
    poll();
  </script>
</body>
</html>
