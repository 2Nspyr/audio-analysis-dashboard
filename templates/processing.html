<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Analyzing...</title>
  <style>
    :root {
      --bg: #0a0c11; --panel: #151922; --border: #262b38; --border-soft: #1e2330;
      --text: #e7e9ee; --text-dim: #8b93a7; --text-faint: #5c6478;
      --accent: #4fd1c5; --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      max-width: 640px; margin: 0 auto; padding: 0 20px; text-align: center;
      background: radial-gradient(ellipse 900px 500px at 50% -10%, #182035 0%, var(--bg) 55%);
      color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .analyzer {
      width: 220px; height: 60px; margin: 0 auto 26px;
      display: flex; align-items: flex-end; justify-content: center; gap: 4px;
    }
    .analyzer .bar {
      width: 8px; border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--accent), #1d6f68);
      animation: bounce 1.1s ease-in-out infinite;
    }
    .analyzer .bar:nth-child(1) { height: 30%; animation-delay: -1.0s; }
    .analyzer .bar:nth-child(2) { height: 60%; animation-delay: -0.8s; }
    .analyzer .bar:nth-child(3) { height: 90%; animation-delay: -0.6s; }
    .analyzer .bar:nth-child(4) { height: 45%; animation-delay: -0.4s; }
    .analyzer .bar:nth-child(5) { height: 75%; animation-delay: -0.2s; }
    .analyzer .bar:nth-child(6) { height: 35%; animation-delay: 0s; }
    .analyzer .bar:nth-child(7) { height: 65%; animation-delay: -0.5s; }
    .analyzer .bar:nth-child(8) { height: 25%; animation-delay: -0.9s; }
    @keyframes bounce {
      0%, 100% { height: 15%; opacity: 0.6; }
      50% { height: 90%; opacity: 1; }
    }
    .stage { font-size: 15px; color: var(--text); margin-bottom: 8px; letter-spacing: 0.02em; }
    .elapsed { color: var(--text-faint); font-size: 12.5px; font-family: 'SF Mono', ui-monospace, monospace; }
    .error {
      background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.35); color: #fca5a5;
      padding: 16px 18px; border-radius: var(--radius); text-align: left; margin-top: 24px; font-size: 13.5px;
    }
    .error a { display: inline-block; margin-top: 10px; color: var(--accent); }
    .brand-logo { height: 22px; width: auto; opacity: 0.75; margin-bottom: 40px; }
  </style>
</head>
<body>
  <img src="/static/img/logo.png" alt="Brenda Johnston" class="brand-logo">
  <div id="working">
    <div class="analyzer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="stage" id="stageText">Starting…</div>
    <div class="elapsed" id="elapsedText"></div>
  </div>
  <div id="errorBox" class="error" style="display:none;"></div>

  <script>
    const jobId = {{ job_id | tojson }};
    const startTime = Date.now();

    function poll() {
      fetch(`/job/${jobId}/status`)
        .then(r => r.json())
        .then(data => {
          const elapsed = Math.round((Date.now() - startTime) / 1000);
          document.getElementById('elapsedText').textContent = elapsed + 's elapsed';

          if (data.status === 'done') {
            document.getElementById('stageText').textContent = 'Done — loading report…';
            window.location.href = data.redirect_url;
            return;
          }
          if (data.status === 'error') {
            document.getElementById('working').style.display = 'none';
            const box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.innerHTML = (data.error || 'Something went wrong.') + '<br><a href="/analyze">&larr; Try again</a>';
            return;
          }
          document.getElementById('stageText').textContent = (data.stage || 'working') + '…';
          setTimeout(poll, 1000);
        })
        .catch(() => setTimeout(poll, 2000));
    }
    poll();
  </script>
</body>
</html>
